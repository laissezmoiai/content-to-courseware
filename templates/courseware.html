<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>课件标题</title>
<style>
:root { --ink:#1a1a2e; --accent:#4a3f9f; --bg:#f7f6fb; --line:#e3e0ef; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); line-height:1.7; }
header { padding:48px 32px 32px; background:#fff; border-bottom:2px solid var(--line); }
h1 { font-size:28px; margin-bottom:8px; }
header .meta { color:#666; font-size:14px; }
header .meta span { margin-right:16px; }
.sourcing { margin-top:12px; padding:10px 14px; background:var(--bg); border-left:3px solid var(--accent); font-size:13px; color:#555; }
.route { margin-top:16px; padding:14px 18px; background:#fff; border:1px solid var(--line); border-radius:8px; }
.route li { margin:4px 0 4px 18px; font-size:14px; }
main { max-width:860px; margin:0 auto; padding:24px 16px; }
section.screen.lesson { background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px; margin:24px 0; }
section.lesson > h2 { font-size:22px; margin-bottom:12px; }
.goal { padding:10px 14px; background:#eef7ee; border-radius:8px; margin-bottom:16px; font-weight:500; }
article.card { border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin:16px 0; background:#fff; }
article.card .cap { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.tag { font-size:12px; padding:2px 10px; border-radius:99px; background:var(--accent); color:#fff; }
.cid { font-size:12px; color:#999; font-family:monospace; }
article.card h3 { font-size:17px; margin:6px 0 10px; }
p.row { font-size:14px; margin:6px 0; }
p.row b { color:var(--accent); margin-right:8px; }
ol.steps { margin:8px 0 8px 22px; }
ol.steps li { margin:6px 0; font-size:14px; }
figure { margin:12px 0; }
figure img { max-width:100%; border:1px solid var(--line); border-radius:8px; }
figcaption { font-size:12px; color:#888; margin-top:4px; }
a.src, span.src { display:inline-block; font-size:13px; margin:4px 8px 0 0; color:var(--accent); }
.practice { margin-top:18px; padding:12px 16px; background:#fdf6e9; border-radius:8px; font-size:14px; }
.cheatsheet { margin-top:14px; padding:12px 16px; background:#eef2fb; border-radius:8px; font-size:14px; }
footer { padding:24px 32px 48px; }
.appendix { max-width:860px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 28px; }
.appendix h2 { font-size:18px; margin-bottom:10px; }
.appendix li { margin:6px 0 6px 18px; font-size:14px; }
.note { font-size:12px; color:#b58a00; margin-right:6px; }
</style>
</head>
<body>
<header>
<h1>课件标题</h1>
<div class="meta">
档位：完整档 · <span id="n-lessons">0</span> 节 · <span id="n-cards">0</span> 张知识卡 · <span id="n-figures">0</span> 图
</div>
<p class="sourcing">取材说明：蒸馏自 <N> 集共 <总分钟> 分钟，覆盖率 <NN>%。</p>
<ul class="route">
<li>开场 <a class="src" href="#">第1集 00:00</a></li>
</ul>
</header>
<main>
<section class="screen lesson" id="s01">
<h2>第一节标题</h2>
<p class="goal">学完你能做到：……</p>
<!--CARD A-P-01-->
<div class="practice"><p>练习：……</p></div>
<div class="cheatsheet"><p>速查：……</p></div>
</section>
</main>
<footer>
<div class="appendix">
<h2>附录 · 背景与备用卡</h2>
<ul>
<!--APPENDIX-CARDS-->
</ul>
</div>
</footer>
</body>
</html>
